<!doctype html><meta charset="utf-8"><title>Doodlog logo</title>
<style>body{margin:0;padding:24px;background:#f7f5f0;font:700 14px Nunito,system-ui;color:#161616}
.r{display:flex;gap:28px;align-items:end;margin:0 0 36px}.r img{border-radius:22.5%;box-shadow:0 1px 3px #0002}
h3{margin:0 0 10px}</style>
<script>for(const [f,t] of [['a-polaroid','A · Polaroid + crayon'],['b-d-cream','B · d smiley, cream'],['c-d-red','C · d smiley, red'],['d-calendar','D · calendar sun']])
document.write(`<h3>${t}</h3><div class=r>${[180,120,60,40,29].map(s=>`<img src="png/${f}.png" width=${s}>`).join('')}</div>`)</script>
