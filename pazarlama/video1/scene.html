<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@800;900&display=block" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--surface:#fffdf7;--edge:#e2dbcd;--ink:#161616;--red:#c9533a}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:Nunito,sans-serif;color:var(--ink);position:relative}
.grain{position:absolute;inset:0;opacity:.35;pointer-events:none;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .28 0 0 0 .12 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.hook{position:absolute;left:0;right:0;top:250px;text-align:center}
.hook span{display:inline-block;background:#fff;padding:14px 30px;border-radius:22px;font:900 58px/1.15 Nunito;margin:6px 0;box-shadow:0 5px 0 var(--edge)}
.card{position:absolute;left:70px;top:520px;width:940px;height:940px;border-radius:44px;background:var(--surface);
 box-shadow:0 12px 0 var(--edge);overflow:hidden;transform-origin:50% 50%}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .d{background:#fff}
.crayon{position:absolute;width:70px;height:300px;transform-origin:50% 0;z-index:5;filter:drop-shadow(0 8px 0 rgba(0,0,0,.12))}
.crayon svg{width:100%;height:100%}
.tag{position:absolute;top:28px;left:28px;background:rgba(22,22,22,.78);color:#fff;font:900 30px Nunito;padding:8px 20px;border-radius:30px;letter-spacing:.04em}
.cal{position:absolute;left:28px;right:28px;top:300px}
.cal h1{font:700 110px Caveat;text-align:center;margin-bottom:10px}
.cal .sub{font:800 34px Nunito;text-align:center;opacity:.55;margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.day{aspect-ratio:1;border-radius:22px;background:#efebe3;position:relative;overflow:hidden}
.day b{position:absolute;left:10px;top:8px;font:900 22px Nunito;opacity:.45;z-index:2}
.day img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:22px;border:4px solid #fff}
.day.f{background:var(--surface);box-shadow:0 6px 0 var(--edge)}
.day.f b{background:#fff;border-radius:10px;padding:0 7px;opacity:1}
.day.today{outline:5px solid var(--red)}
.brand{position:absolute;left:0;right:0;top:1440px;text-align:center;font:900 44px Nunito}
.brand small{display:block;font:800 30px Nunito;opacity:.55;margin-top:6px}
</style></head><body>
<div id="root"></div>
<div class="grain"></div>
<script>
const W=1080, PAIRS=[2,6,1], PAIR_T=2.7, CAL_T=PAIRS.length*PAIR_T, END=CAL_T+3.6;
const FILL=[[2,1],[3,3],[5,4],[6,2],[8,5],[9,7],[11,6],[12,8],[14,1],[16,3],[17,4],[19,2],[20,6],[22,5],[23,8],[25,7],[26,1],[27,2]];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CRAYON=`<svg viewBox="0 0 70 300" width="70" height="300"><path d="M14 40 L35 0 L56 40 Z" fill="#a63f29"/><rect x="10" y="38" width="50" height="262" rx="8" fill="#c9533a"/><rect x="10" y="70" width="50" height="14" fill="#8f3524"/><rect x="10" y="250" width="50" height="14" fill="#8f3524"/><rect x="18" y="100" width="10" height="130" rx="5" fill="#fff" opacity=".25"/></svg>`;
// zigzag reveal edge: crayon-like jagged boundary
function edge(x){let p=[];for(let y=0;y<=940;y+=20){p.push(`${x+Math.sin(y*.09)*14+((y/20)%2?10:-10)}px ${y}px`)}return p}
function revealPoly(x){return `polygon(0 0,${edge(x).join(',')},0 940px)`}

function render(t){
  const r=document.getElementById('root'); let h='';
  // hook text, first 3.2s
  const ho=t<3.2?clamp(t/.25):clamp(1-(t-3.2)/.3);
  const hy=(1-back(t/.45))*-40;
  if(ho>0) h+=`<div class="hook" style="opacity:${ho};transform:translateY(${hy}px)"><span>every day, one photo of us</span><br><span>became a drawing</span></div>`;
  if(t<CAL_T+0.6){
    const i=Math.min(PAIRS.length-1,Math.floor(t/PAIR_T)), lt=t-i*PAIR_T, n=PAIRS[i];
    // card enter/exit
    let s=1,o=1,rot=(i%2?2:-2),y=0;
    if(i>0){const e=back(lt/.5);s=.86+.14*e;o=clamp(lt/.2);y=(1-e)*80}
    const last=i===PAIRS.length-1, out=last?clamp((t-CAL_T+.4)/.6):0;
    if(last&&out>0){s*=1-.75*ease(out);o*=1-ease(out);y-=ease(out)*150}
    const rev=ease((lt-.55)/1.15); const x=-40+rev*1040;
    h+=`<div class="card" style="opacity:${o};transform:translateY(${y}px) rotate(${rot*(1-rev)}deg) scale(${s})">
      <img src="img/p${n}.jpg">
      <img class="d" src="img/d${n}.jpg" style="clip-path:${revealPoly(x)}">
      <div class="tag" style="opacity:${1-rev}">PHOTO</div>
      <div class="tag" style="opacity:${rev>.98?1:0};background:var(--red)">DRAWN</div>
    </div>`;
    if(rev>0&&rev<1){const cy=520+470+Math.sin(lt*14)*300;h+=`<div class="crayon" style="width:110px;height:470px;left:${70+x-55}px;top:${cy}px;transform:rotate(${200+Math.sin(lt*14)*10}deg)">${CRAYON}</div>`}
  }
  if(t>=CAL_T-0.1){
    const ct=t-CAL_T+.1, co=clamp(ct/.35);
    let g='';
    for(let d=1;d<=31;d++){
      const k=FILL.findIndex(f=>f[0]===d), at=.35+k*.09, pt=ct-at;
      if(k>=0&&pt>0){
        const sc=back(pt/.35);
        g+=`<div class="day f${d===27?' today':''}" style="transform:scale(${.4+.6*sc}) rotate(${(1-clamp(pt/.35))*(d%2?-8:8)}deg)"><b>${d}</b><img src="img/d${FILL[k][1]}.jpg"></div>`;
      } else g+=`<div class="day"><b>${d}</b></div>`;
    }
    h+=`<div class="cal" style="opacity:${co};transform:translateY(${(1-ease(ct/.5))*60}px)"><h1>our month</h1><div class="sub">October · 18 drawings</div><div class="grid">${g}</div></div>`;
    const bo=clamp((ct-2.4)/.4);
    h+=`<div class="brand" style="opacity:${bo}">Doodlog<small>your days, drawn</small></div>`;
  }
  r.innerHTML=h;
}
window.END=END;
window.ready=Promise.all([document.fonts.ready,...[1,2,3,4,5,6,7,8].flatMap(n=>['p','d'].map(k=>new Promise(res=>{const i=new Image();i.onload=i.onerror=res;i.src=`img/${k}${n}.jpg`})))]);
const q=new URLSearchParams(location.search).get('t'); render(q?+q:0);
</script></body></html>
