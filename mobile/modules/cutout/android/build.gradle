plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cutout'
version = '1.0.0'

android {
  namespace "expo.modules.cutout"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // On-device subject segmentation. The model comes through Google Play services.
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
